import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.net.URI
import java.net.URLEncoder
import java.nio.file.AtomicMoveNotSupportedException
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest
import java.util.zip.ZipFile

plugins {
    id 'eclipse'
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
    networkTimeout = 60_000
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            args '--nogui'
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

sourceSets {
    updater {
        java.srcDir 'src/updater/java'
    }
}

dependencies {
    testImplementation sourceSets.updater.output
}

repositories {
    maven {
        url = 'https://maven.minecraftforge.net/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly 'net.java.dev.jna:jna-platform:5.12.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.register('resetConfig', Delete) {
    group = 'devwatcher'
    description = 'Resets saved DevWatcher preferences and server configuration.'

    delete file('run/config/relizc-watcher.properties')
    delete file('run/config/relizc-watcher-server.toml')

    doLast {
        logger.lifecycle('DevWatcher configuration reset. Consent, the connection choice, and default server config return on the next client launch.')
    }
}

def updaterJar = tasks.register('updaterJar', Jar) {
    group = 'build'
    description = 'Builds the dependency-free helper that installs content after Minecraft exits.'
    archiveFileName = 'devwatcher-updater.jar'
    destinationDirectory = layout.buildDirectory.dir('updater')
    from sourceSets.updater.output
    manifest {
        attributes('Main-Class': 'dev.bisz.watcher.updater.ContentUpdater')
    }
}

/** Creates an immutable, SHA-256-addressed snapshot of configured runtime content. */
tasks.register('deployBuild') {
    group = 'distribution'
    description = 'Publishes configured .minecraft content roots and atomically advances latest.'

    def runtimeSource = layout.projectDirectory.dir('.minecraft')
    inputs.dir(runtimeSource).withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.property('deployContentRoots', providers.gradleProperty('deploy_content_roots').orElse(''))
    outputs.upToDateWhen { false }

    doLast {
        def contentHash = { File sourceFile ->
            def digest = MessageDigest.getInstance('SHA-256')
            sourceFile.withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int bytesRead; (bytesRead = input.read(buffer)) != -1;) {
                    digest.update(buffer, 0, bytesRead)
                }
            }
            digest.digest().collect { String.format('%02x', it & 0xff) }.join()
        }

        def modIdsForJar = { File jarFile ->
            def archive = new ZipFile(jarFile)
            try {
                def tomlEntry = ['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']
                        .collect { archive.getEntry(it) }
                        .find { it != null }
                if (tomlEntry != null) {
                    def toml = archive.getInputStream(tomlEntry).getText('UTF-8')
                    def modIds = []
                    def modBlocks = toml =~ /(?ms)^\s*\[\[mods\]\]\s*(.*?)(?=^\s*\[\[|\z)/
                    modBlocks.each { block ->
                        def idMatcher = block[1] =~ /(?m)^\s*modId\s*=\s*["']([^"']+)["']/
                        if (idMatcher.find()) {
                            modIds << idMatcher.group(1)
                        }
                    }
                    return modIds.unique().sort()
                }

                def fabricEntry = archive.getEntry('fabric.mod.json')
                if (fabricEntry != null) {
                    def fabricMetadata = new JsonSlurper().parse(archive.getInputStream(fabricEntry))
                    return fabricMetadata.id ? [fabricMetadata.id.toString()] : []
                }

                return []
            } finally {
                archive.close()
            }
        }

        def configuredRoots = (findProperty('deploy_content_roots') ?: '').toString()
                .split(',')
                .collect { it.trim().replace('\\', '/') }
                .findAll { !it.isBlank() }
                .unique()
        if (configuredRoots.empty) {
            throw new GradleException('deploy_content_roots must contain at least one runtime-relative directory.')
        }

        File sourceRoot = runtimeSource.asFile.canonicalFile
        def resolvedRoots = configuredRoots.collect { relativeRoot ->
            if (relativeRoot.startsWith('/') || relativeRoot ==~ /^[A-Za-z]:.*/ || relativeRoot.split('/').contains('..')) {
                throw new GradleException("Invalid deploy content root: ${relativeRoot}")
            }
            File resolved = new File(sourceRoot, relativeRoot).canonicalFile
            if (!resolved.toPath().startsWith(sourceRoot.toPath()) || !resolved.isDirectory()) {
                throw new GradleException("Deploy content root does not resolve to a directory under .minecraft: ${relativeRoot}")
            }
            [name: relativeRoot, directory: resolved]
        }

        def deploymentHost = (findProperty('deployHost') ?: findProperty('deploy_host') ?: 'localhost:4748').toString()
        def baseUrl = deploymentHost ==~ /(?i)https?:\/\/.+/ ? deploymentHost : "http://${deploymentHost}"
        baseUrl = baseUrl.replaceAll('/+$', '')
        URI parsedBaseUrl
        try {
            parsedBaseUrl = URI.create(baseUrl)
        } catch (IllegalArgumentException error) {
            throw new GradleException("Invalid deployment host: ${deploymentHost}", error)
        }
        if (!(parsedBaseUrl.scheme?.toLowerCase() in ['http', 'https']) || parsedBaseUrl.host == null) {
            throw new GradleException("Deployment host must be an HTTP or HTTPS host: ${deploymentHost}")
        }
        def releaseId = "assemble_${minecraft_version}_${new Date().format('yyyyMMddHHmmss')}"
        File deployRoot = layout.buildDirectory.dir('deploy').get().asFile
        File releaseDirectory = new File(deployRoot, releaseId)
        File temporaryDirectory = new File(deployRoot, ".${releaseId}.${UUID.randomUUID()}.tmp")
        if (releaseDirectory.exists()) {
            throw new GradleException("Deployment already exists: ${releaseDirectory}")
        }

        def artifacts = new TreeMap<String, Map<String, Map>>()
        def modIdHashes = [:]
        int sourceFileCount = 0

        try {
            temporaryDirectory.mkdirs()
            resolvedRoots.each { configuredRoot ->
                fileTree(configuredRoot.directory).files.findAll { it.isFile() }.sort { it.absolutePath }.each { File sourceFile ->
                    sourceFile = sourceFile.canonicalFile
                    if (!sourceFile.toPath().startsWith(configuredRoot.directory.toPath())
                            || !sourceFile.toPath().startsWith(sourceRoot.toPath())) {
                        throw new GradleException("Deploy source escapes its configured runtime root: ${sourceFile}")
                    }
                    sourceFileCount++
                    String relativeParent = sourceRoot.toPath().relativize(sourceFile.parentFile.toPath()).toString().replace('\\', '/')
                    String manifestDirectory = "@/${relativeParent}"
                    String encodedDirectory = relativeParent.split('/').collect {
                        URLEncoder.encode(it, 'UTF-8').replace('+', '%20')
                    }.join('/')
                    int extensionIndex = sourceFile.name.lastIndexOf('.')
                    String extension = extensionIndex > 0 ? sourceFile.name.substring(extensionIndex) : ''
                    if (!(extension ==~ /(?:\.[A-Za-z0-9_-]+)?/)) {
                        throw new GradleException("Unsupported file extension for ${sourceFile}: ${extension}")
                    }

                    String hash = contentHash(sourceFile)
                    def directoryArtifacts = artifacts.computeIfAbsent(manifestDirectory) { new TreeMap<String, Map>() }
                    def existing = directoryArtifacts[hash]
                    if (existing != null) {
                        if (existing.extension != extension) {
                            throw new GradleException("Identical content has conflicting extensions in ${manifestDirectory}: ${hash}")
                        }
                        return
                    }

                    def artifact = [
                            extension : extension,
                            downloadUrl: "${baseUrl}/${releaseId}/${encodedDirectory}/${hash}${extension}"
                    ]
                    if (relativeParent == 'mods' && extension.equalsIgnoreCase('.jar')) {
                        def modIds = modIdsForJar(sourceFile)
                        if (modIds.empty) {
                            throw new GradleException("Could not determine a mod ID for ${sourceFile}.")
                        }
                        modIds.each { modId ->
                            def previousHash = modIdHashes.putIfAbsent(modId, hash)
                            if (previousHash != null && previousHash != hash) {
                                throw new GradleException("Mod ID '${modId}' maps to multiple content hashes: ${previousHash} and ${hash}")
                            }
                        }
                        artifact.modIds = modIds
                    }
                    directoryArtifacts[hash] = artifact

                    File targetDirectory = new File(temporaryDirectory, relativeParent)
                    targetDirectory.mkdirs()
                    Files.copy(sourceFile.toPath(), new File(targetDirectory, "${hash}${extension}").toPath())
                }
            }

            def manifest = [release: releaseId, algorithm: 'SHA-256', artifacts: artifacts]
            File manifestFile = new File(temporaryDirectory, 'manifest.json')
            manifestFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + System.lineSeparator()

            deployRoot.mkdirs()
            try {
                Files.move(temporaryDirectory.toPath(), releaseDirectory.toPath(), StandardCopyOption.ATOMIC_MOVE)
            } catch (AtomicMoveNotSupportedException ignored) {
                Files.move(temporaryDirectory.toPath(), releaseDirectory.toPath())
            }

            File latestTemporary = new File(deployRoot, ".latest.${UUID.randomUUID()}.tmp")
            latestTemporary.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                    latest: "/build/deploy/${releaseId}/manifest.json"
            ])) + System.lineSeparator()
            try {
                Files.move(latestTemporary.toPath(), new File(deployRoot, 'latest.json').toPath(),
                        StandardCopyOption.ATOMIC_MOVE, StandardCopyOption.REPLACE_EXISTING)
            } catch (AtomicMoveNotSupportedException ignored) {
                Files.move(latestTemporary.toPath(), new File(deployRoot, 'latest.json').toPath(),
                        StandardCopyOption.REPLACE_EXISTING)
            }
        } finally {
            if (temporaryDirectory.exists()) {
                temporaryDirectory.deleteDir()
            }
        }

        int uniqueArtifacts = artifacts.values().sum(0) { it.size() }
        logger.lifecycle("Published ${uniqueArtifacts} unique artifact(s) from ${sourceFileCount} source file(s): ${releaseDirectory}")
    }
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn updaterJar
    from(updaterJar.flatMap { it.archiveFile }) {
        into 'devwatcher'
        rename { 'updater.jar' }
    }

    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea.module {
    downloadSources = true
    downloadJavadoc = true
}
